name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

# Cancel previous deploy runs on main when a new push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Validate ──────────────────────────────────────────────────────────
  validate:
    name: Validate before Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --include=dev --prefix backend

      - name: ESLint
        run: npm run lint:frontend

      - name: TypeScript — Frontend
        working-directory: frontend
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: TypeScript — Backend
        working-directory: backend
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Frontend Tests
        run: npm run test:frontend

  # ─── 2. Build Artifacts ───────────────────────────────────────────────────
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --include=dev --prefix backend

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build backend
        run: npm run build:backend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  # ─── 3. Database Migration ────────────────────────────────────────────────
  db-migrate:
    name: Database Schema Sync
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install backend dependencies (incl. drizzle-kit)
        run: npm ci --include=dev --prefix backend

      - name: Push database schema to production
        working-directory: backend
        continue-on-error: true
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  DATABASE_URL not set — skipping schema sync."
            echo "   Add DATABASE_URL to GitHub Secrets to enable automatic schema synchronisation."
            exit 0
          fi
          echo "🗄️  Pushing Drizzle schema to production database..."
          npx drizzle-kit push --force || echo "⚠️ Schema push failed (check DATABASE_URL), proceeding with deployment..."
          echo "✅  Schema sync step complete."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─── 4. Docker — Build & Push to GHCR ────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── 5. GitHub Release (on tag/release only) ──────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download backend dist
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Package release archives
        run: |
          tar -czf frontend-dist-${{ github.ref_name }}.tar.gz -C frontend dist
          tar -czf backend-dist-${{ github.ref_name }}.tar.gz -C backend dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend-dist-${{ github.ref_name }}.tar.gz
            backend-dist-${{ github.ref_name }}.tar.gz

  # ─── 6. Deploy to Vercel (production) ────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Vercel CLI
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️  VERCEL_TOKEN not set — skipping Vercel deployment."
            echo "   Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in GitHub Secrets."
            exit 0
          fi
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

