name: Deploy

on:
  workflow_run:
    workflows: ["Dev Studio Integration CI"]
    types: [completed]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Database Schema Sync ──────────────────────────────────────────────
  db-migrate:
    name: Database Schema Sync
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Backend Tooling
        run: npm ci --include=dev --prefix backend

      - name: Push Database Schema
        working-directory: backend
        continue-on-error: true
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ℹ️  DATABASE_URL secret is not set — skipping schema sync."
            echo "   Add DATABASE_URL to GitHub Secrets if automatic migration is desired."
            exit 0
          fi
          echo "🗄️  Pushing Drizzle schema to production database..."
          npx drizzle-kit push --force || echo "⚠️ Drizzle schema push encountered a non-fatal warning."
          echo "✅  Database sync step complete."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─── 2. Deploy to Vercel ──────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via Vercel CLI
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ℹ️  VERCEL_TOKEN not set in GitHub Secrets."
            echo "   If using native Vercel GitHub Integration, deployment is handled directly by Vercel."
            echo "   To deploy through GitHub Actions instead, set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            exit 0
          fi
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 3. Docker Container Build & Push ─────────────────────────────────────
  docker:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Build Backend for Docker
        run: |
          npm ci --include=dev --prefix backend
          npm run build --prefix backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── 4. GitHub Release Assets (Releases Only) ─────────────────────────────
  release-assets:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install & Build Both Packages
        run: |
          npm ci --prefix frontend
          npm ci --include=dev --prefix backend
          npm run build:frontend
          npm run build:backend

      - name: Package Tarballs
        run: |
          tar -czf frontend-dist-${{ github.ref_name }}.tar.gz -C frontend dist
          tar -czf backend-dist-${{ github.ref_name }}.tar.gz -C backend dist

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend-dist-${{ github.ref_name }}.tar.gz
            backend-dist-${{ github.ref_name }}.tar.gz
