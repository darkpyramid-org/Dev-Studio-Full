name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types: [completed]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Vercel Token
        id: check_token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  VERCEL_TOKEN is not set in GitHub Secrets."
            echo "   Vercel auto-deploys via the Dashboard git integration on every push."
            echo "   Add VERCEL_TOKEN to GitHub Secrets to enable workflow-controlled deploys."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel
        if: steps.check_token.outputs.configured == 'true'
        run: |
          npm install -g vercel@latest

          # ── Diagnostics (non-sensitive) ──
          # Shows which account/teams/projects the token can actually access,
          # so a wrong VERCEL_ORG_ID / VERCEL_PROJECT_ID secret is easy to spot.
          echo "› Token identity:"
          vercel whoami --token="$VERCEL_TOKEN" || true
          echo "› Teams accessible to this token:"
          vercel teams ls --token="$VERCEL_TOKEN" || true
          echo "› Projects accessible to this token:"
          vercel projects ls --token="$VERCEL_TOKEN" || true

          # ── Link ──
          # Prefer explicit org/project targeting; if the configured scope is
          # not resolvable (bad VERCEL_ORG_ID), retry without --scope so the
          # deploy still targets the token's default team.
          if ! vercel link --yes \
               --token="$VERCEL_TOKEN" \
               --scope="$VERCEL_ORG_ID" \
               --project="$VERCEL_PROJECT_ID"; then
            echo "⚠️  Explicit link failed (scope '$VERCEL_ORG_ID' not resolvable by this token)."
            echo "    Retrying with the token's default scope..."
            vercel link --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID"
          fi

          echo "Deploying to production..."
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Optional — only needed for explicit project linking
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
