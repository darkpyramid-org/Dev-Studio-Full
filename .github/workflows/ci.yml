name: Dev Studio Integration CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Linting & Code Style ──────────────────────────────────────────────
  lint:
    name: ESLint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint:frontend

  # ─── 2. Type Checking (Parallel) ──────────────────────────────────────────
  typecheck:
    name: TypeScript Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frontend
            prefix: frontend
          - target: backend
            prefix: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Dependencies
        run: npm ci --include=dev --prefix ${{ matrix.prefix }}

      - name: Run TypeScript Compiler Check
        working-directory: ${{ matrix.prefix }}
        run: node node_modules/typescript/bin/tsc --noEmit

  # ─── 3. Unit & Integration Tests (Parallel) ───────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Run Vitest (Frontend)
        run: npm run test:frontend

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Backend Dependencies
        run: npm ci --include=dev --prefix backend

      - name: Run Vitest (Backend)
        run: npm run test:backend

  # ─── 4. Build Artifacts Verification ──────────────────────────────────────
  build:
    name: Build & Package Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Dependencies
        run: |
          npm ci --prefix frontend
          npm ci --include=dev --prefix backend

      - name: Build Frontend
        run: npm run build:frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Backend
        run: npm run build:backend

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 2

      - name: Upload Backend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 2
