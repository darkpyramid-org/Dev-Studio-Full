name: 💡 Feature Request
description: Suggest an idea or enhancement for Dev Studio
title: "[FEATURE]: "
labels: ["enhancement", "needs-triage"]
assignees: ["Mostafa-SAID7"]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Dev Studio even better? Share it below!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see added or changed.
      placeholder: A clear description of the feature or behavior...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - Prompts & AI Agents
        - React Components & Snippets
        - Interview Preparation & Soft Skills
        - Project Templates
        - Developer Tooling & UI/UX
        - Backend & Integrations
        - Other
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request implementing this feature!
          required: false
