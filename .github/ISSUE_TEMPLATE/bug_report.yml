name: 🐛 Bug Report
description: File a bug report to help improve Dev Studio
title: "[BUG]: "
labels: ["bug", "needs-triage"]
assignees: ["Mostafa-SAID7"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps do we take to observe this bug?
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Frontend (React / Vite UI)
        - Backend (Express / API)
        - Database (PostgreSQL / Drizzle)
        - Authentication (Supabase / Session)
        - CI/CD / Deployment
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Browser, Node version, etc.
      placeholder: Windows 11, Chrome 124, Node 20.x
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Paste any screenshots, console errors, or server logs here.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest version of Dev Studio.
          required: false
